<svg width="346" height="167.6" viewBox="0 0 346 167.6" xmlns="http://www.w3.org/2000/svg">
  <foreignObject x="0" y="0" width="346" height="167.6">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .banner { 
          width: 346px;
          height: 167.6px;
          box-sizing: border-box; 
          padding: 24px; 
          display: flex; 
          flex-direction: column; 
          justify-items: center;
          font-family: 'JetBrains Mono', monospace; 
          color: #F4F4F4;
          
          gap: 18px;
        }
        .label { 
          font-size: 18px; 
          color: #F4F4F4; 
          padding: 0 24px;
        }
        .repo-card {
           background-color: #2B2D5B; 
          padding: 16px;
          border-radius: 8px;
          border: 2px solid #f4f4f489;
          flex: 1;
          margin: 0 24px;
          margin-bottom: 8px;
          display: flex;
          flex-direction: column;
          position: relative;
          overflow: hidden;
        }
        .repo-header { display: flex; align-items: center; gap: 8px; }
        .repo-header-icon { width: 24px; height: 24px; fill: #F4F4F4; }
        .repo-name { font-size: 18px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;  }
        .repo-is-archive { font-size: 12px; border-radius: 20px; padding: 2px 8px; border: 1px solid #EEC444; color: #EEC444; }
        .repo-body { font-size: 16px; padding: 12px 0px; margin-right: 25%; opacity: 0.8; flex: 1; }
        .repo-language { display: flex; align-items: center; gap: 4px; }
        .repo-language-color { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.3); }
        .repo-desc { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .repo-footer { font-size: 12px; display: flex; align-items: center; gap: 32px; color: rgba(255, 255, 255, 0.8); }
        .repo-footer > div { display: flex; align-items: center; gap: 4px; opacity: 0.8; }
        .repo-footer > div > svg { width: 18px; height: 18px; }

        .sparkline-graph {
          position: absolute;
          top: 40%;
          left: 70%;
          width: 30%;
          height: 100%;
          z-index: 1;
          opacity: 0.5;
        }
      </style>

      <div class="banner" style="padding: 16px; margin: 0 3px">
        <div class="label" style="display: none;">recently updated repository</div>
        <div class="repo-card" style="margin: 0">
          <div class="sparkline-graph"> </div>
          <div class="repo-header">
            <svg class="repo-header-icon" style="display: none;" xmlns="http://www.w3.org/2000/svg" x="0" y="-13" viewBox="0 0 16 16" version="1.1" width="16" height="16">
              <path fill-rule="evenodd" d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8zM5 12.25v3.25a.25.25 0 00.4.2l1.45-1.087a.25.25 0 01.3 0L8.6 15.7a.25.25 0 00.4-.2v-3.25a.25.25 0 00-.25-.25h-3.5a.25.25 0 00-.25.25z"/>
            </svg>
            <div class="repo-name">setup-some-stuffs</div>
            <div class="repo-is-archive" style="display: none;"> archive </div>
          </div>
          <div class="repo-body" style="margin: 0">
            <div class="repo-desc">setup anything :D</div>
          </div>
          <div class="repo-footer">
            <div class="repo-language">
              <div class="repo-language-color" style="background-color: #3572A5"/>
              Python
            </div>
            <div class="repo-commit-count">
              <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#F4F4F4"><path d="M352.5-325.5Q298-371 284-440H80v-80h204q14-69 68.5-114.5T480-680q73 0 127.5 45.5T676-520h204v80H676q-14 69-68.5 114.5T480-280q-73 0-127.5-45.5ZM480-360q50 0 85-35t35-85q0-50-35-85t-85-35q-50 0-85 35t-35 85q0 50 35 85t85 35Z"/></svg>
              9 commits
            </div>
            <div class="repo-updated-at" style="display: none;">
              <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#F4F4F4"><path d="M326-171q-15-11-22-28l-92-241H40v-80h228l92 244 184-485q7-17 22-28t34-11q19 0 34 11t22 28l92 241h172v80H692l-92-244-184 485q-7 17-22 28t-34 11q-19 0-34-11Z"/></svg>
              last updated Today 9pm
            </div>
          </div>
        </div>

      </div>
    </div>
  </foreignObject>
    
</svg>
