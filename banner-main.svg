<svg width="680" height="180" viewBox="0 0 680 180" xmlns="http://www.w3.org/2000/svg">
  <foreignObject x="0" y="0" width="680" height="180">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .banner { 
          width: 680px;
          height: 180px; 
          box-sizing: border-box; 
          padding: 0 20px; 
          display: flex; 
          flex-direction: column; 
          justify-items: center;
          font-family: 'JetBrains Mono', monospace; 
          color: #F4F4F4;
          background-color: #2B2D5B;
          letter-spacing: 1.5px;
        }
        
        .today-header {margin-bottom: 5px}
        .title { margin: 0; padding: 18px 0 0; text-align: center; font-size: 15px; font-weight: 700; letter-spacing: 3px; }
        .date { margin: 16px 0; text-align: center; font-size: 14px; letter-spacing: 1.5px; color: #F4F4F4; }
        .dashboard { display: flex; flex: 1; }
        .col { flex: 1; text-align: center; }
        .label { font-size: 18px; letter-spacing: 1.2px; color: #F4F4F4; }
        .val { height: 60px; overflow: hidden; font-size: 48px; font-weight: 700; color: #F4F4F4; letter-spacing: 5px; line-height: 1.25; margin: 6px 0 }
        .v-line { width: 4px; height: 80%; background: #ABABAB; opacity: 0.4 }
        .slot-strip { display: flex; flex-direction: column; animation: scrollDown 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .days_streak { display: flex; flex-direction: row; gap: 8px; align-items: center; justify-content: center; overflow: hidden; }
        .fire_icon { fill: #F4F4F4; animation: fire 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        #langs { font-size: 32px; margin: 0; font-weight: 700; animation: stepScroll 12s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
        #langs > div { display: flex; height: 60px; align-items: center; justify-content: center; }
        #langs > div > img,
        #langs > div > svg { width: 40px; margin-right: 8px; }
        #langs { 
          animation: 
          scrollDownLangs 2.15s cubic-bezier(0.2, 0.8, 0.2, 1) forwards, 
          stepScroll 12s cubic-bezier(0.2, 0.8, 0.2, 1) 2.15s infinite; 
          }
        @keyframes scrollDown {
          0%, 50% { transform: translateY(-300%);  } 
          100% { transform: translateY(0); }
        }
        @keyframes fire {
          0% { opacity: 0; transform: scale(0.5); } 
          80% { opacity: 0; transform: scale(0.5) rotate(45deg); } 
          100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        @keyframes scrollDownLangs { 
          0%, 50% { transform: translateY(-300%);  } 
          100% { transform: translateY(-240px); }
        }
        @keyframes stepScroll {
          0%, 10%   { transform: translateY(-240px); }
          20%, 30%  { transform: translateY(-180px); }
          40%, 50%  { transform: translateY(-120px); }
          60%, 70%  { transform: translateY(-60px); }
          80%, 90%  { transform: translateY(0); }
          100%      { transform: translateY(-240px); }
        }

      </style>

      <div class="banner">
          <p class="date">August 09, 2026</p>

        <div class="dashboard">
          <div class="col">
            <div class="total_commits">
              <div class="val">
                <div class="slot-strip">
                  <div>2706</div> <div>2705</div> <div>2704</div><!-- dont delete this comment -->
                </div>
              </div>
            </div>
